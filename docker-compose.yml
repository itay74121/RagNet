services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - redis
      - chroma
    volumes:
      - ./configs:/app/configs:ro
      - ./data:/app/data
      - ./src:/app/src

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ragnet
      MYSQL_USER: ragnet
      MYSQL_PASSWORD: ragnet
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7.2
    ports:
      - "6379:6379"

  chroma:
    image: chromadb/chroma:latest
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/data/chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data/chroma

volumes:
  mysql_data:
  chroma_data:
